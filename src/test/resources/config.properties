# Defaults for the public sandbox. Every key can be overridden without editing this file:
#   -Dbase.url=https://staging.example.com   (system property), or
#   BASE_URL=https://staging.example.com     (environment variable: upper-case, dots -> underscores)

base.url=https://restful-booker.herokuapp.com
auth.username=admin
auth.password=password123

# HTTP timeouts. The read timeout is generous because the shared Heroku dyno can be slow.
http.connect.timeout.ms=10000
http.read.timeout.ms=30000

# Cold start: before any test runs, poll /ping until healthy or give up after this long.
warmup.timeout.seconds=120

# Retry of transient gateway errors (502/503/504, dropped connections) on idempotent requests.
retry.max.attempts=3
retry.backoff.ms=2000

# Performance smoke check
perf.concurrent.creates=10
perf.p95.threshold.ms=5000
