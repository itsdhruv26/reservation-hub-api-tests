# QA environment (the public sandbox). Selected with -Denv=qa, which is the default.
# Every key can be overridden without editing this file:
#   -DbaseUrl=https://staging.example.com   (system property), or
#   BASE_URL=https://staging.example.com    (environment variable: upper snake case)

baseUrl=https://restful-booker.herokuapp.com

# Key under USERS in yml/qa.yml whose credentials are used for authenticated calls.
authUser=admin

# HTTP timeouts. The read timeout is generous because the shared Heroku dyno can be slow.
connectTimeoutMs=10000
readTimeoutMs=30000

# Print every test request and response to the console (they are always attached to the Allure report).
verbose.console=true
# Add request and response bodies to the Extent report (method, URL and status are always logged).
verbose.report=true

# Cold start: before any test runs, poll /ping until healthy or give up after this long.
warmupTimeoutSeconds=120

# Retry of transient gateway errors (502/503/504, dropped connections) on idempotent requests.
retryMaxAttempts=3
retryBackoffMs=2000

# A test that ends "broken" (timeout, failed setup: anything but a failed assertion) is rerun this many times.
# Failed assertions are findings and are never rerun.
brokenTestRetries=1

# Performance smoke check
perfConcurrentCreates=10
perfP95ThresholdMs=5000
